[versions]
# Upgraded 2026-08-06: every entry here is the latest STABLE release, checked against Google
# Maven / Maven Central maven-metadata that day. Pre-release lines are deliberately skipped
# (navigation 2.10.0-beta01, work 2.12.0-beta01, datastore 1.3.0-alpha10, health-connect
# 1.2.0-alpha04, AGP 9.4.0-alpha08, Kotlin 2.4.20-Beta2), so several versions below look
# behind a "latest" query but are in fact current stable.
#
# AGP 9 has Kotlin support BUILT IN: there is no org.jetbrains.kotlin.android plugin any
# more, and applying it fails the build. `kotlin` below still drives the Compose compiler
# plugin, and AGP compiles with that same version.
#
# KSP has no 2.4 line yet — 2.3.11 is its latest stable, and it runs fine against the
# Kotlin 2.4.10 compiler (Room's KSP pass is green). If a future Kotlin bump breaks KSP,
# that is the constraint to check first.
agp = "9.3.1"
kotlin = "2.4.10"
ksp = "2.3.11"
# core 1.19.0 / lifecycle 2.11.0 require compileSdk 37, which is why the app compiles
# against 37 (platform android-37.1). targetSdk stays at 36 on purpose: raising it opts
# into new OS behaviors and wants testing on an API 37 device, which is a separate call.
coreKtx = "1.19.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.06.01"
room = "2.8.4"
datastore = "1.2.1"
navigationCompose = "2.9.8"
browser = "1.10.0"
work = "2.11.2"
healthConnect = "1.1.0"
junit = "4.13.2"
json = "20260719"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
json = { group = "org.json", name = "json", version.ref = "json" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }
androidx-work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-health-connect = { group = "androidx.health.connect", name = "connect-client", version.ref = "healthConnect" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
